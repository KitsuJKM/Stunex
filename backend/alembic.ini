[alembic]
script_location = migrations

# La URL de conexion no se fija aqui (no se hardcodea, RNF-002).
# migrations/env.py debe leerla desde core.config.settings.database_url.
# migrations/env.py y el resto del scaffolding de Alembic (env.py,
# script.py.mako) se crean en el siguiente paso (primera migracion).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
